[package]
name = "raffi-tabs"
version = "0.1.0"
edition = "2021"
description = "Browser tab switcher for Alfred 6, built on Raffi's Vicinae native messaging host"
license = "MIT"

[dependencies]
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"

[profile.release]
opt-level = 3
lto = true
codegen-units = 1
panic = "abort"
strip = true
