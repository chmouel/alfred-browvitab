name: Release

on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  release:
    runs-on: macos-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
      - run: python -m unittest discover -s tests
      - name: Check the tag matches the version
        run: |
          version=$(python -c 'import re;print(re.search(r"__version__ = \"(.+)\"", open("workflow/tabs.alfredui/lib/browvitab/__init__.py").read()).group(1))')
          test "v$version" = "$GITHUB_REF_NAME"
      - run: python scripts/build.py
      - name: Publish the release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" dist/Browvitab.alfredworkflow --generate-notes --title "$GITHUB_REF_NAME"
